{{! Расчёт базовых параметров и урона
    для тестового сценария }}

baseHp is 100.0
armorRating is 25.0
critMult is 1.5
baseDmg is 20.0

table(
  health => table(
    base => $[baseHp],
    effective => $[baseHp armorRating 100.0 / 1.0 + *],
  ),
  combat => table(
    attack => $[baseDmg],
    critDamage => $[baseDmg critMult *],
    burstPower => $[baseDmg 2.0 pow() critMult + sqrt()],
  ),
)