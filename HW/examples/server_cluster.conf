workersPerNode is 4.0
nodesCount is 3.0
baseTimeout is 1.5

table(
  cluster => table(
    nodes => $[nodesCount],
    totalWorkers => $[workersPerNode nodesCount *],
    {{! Запас по времени на сетевые повторы }}
    requestTimeout => $[baseTimeout 2.0 * 0.5 +],
  ),
  healthcheck => table(
    intervalSec => 5.0,
    jitterWindow => $[baseTimeout sqrt()],
  ),
)