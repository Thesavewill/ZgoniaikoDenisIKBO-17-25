principal is 50000.0
annualRate is 0.12
years is 2.0

table(
  loan => table(
    amount => $[principal],
    monthlyRate => $[annualRate 12.0 /],
    growthFactor => $[1.0 annualRate + years pow()],
    totalProjected => $[principal 1.0 annualRate + years pow() *],
  ),
  reserve => table(
    minBuffer => $[principal 0.1 *],
    riskIndex => $[annualRate 100.0 * sqrt()],
  ),
)